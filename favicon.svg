<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Base Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="rgba(59, 130, 246, 0.3)" stroke-width="8" />
  
  <!-- Outer Glow Hexagon/Square Ring -->
  <rect x="76" y="76" width="360" height="360" rx="80" fill="none" stroke="url(#brandGrad)" stroke-width="12" filter="url(#glow)" opacity="0.8" />
  
  <!-- NextGen 'N' Logo Mark -->
  <path d="M 160 360 L 160 152 C 160 152, 172 144, 190 144 C 205 144, 218 155, 230 172 L 318 316 C 324 326, 332 332, 342 332 L 352 332 L 352 152" 
        fill="none" 
        stroke="url(#brandGrad)" 
        stroke-width="44" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
  
  <!-- Glowing Dot Accent -->
  <circle cx="352" cy="360" r="24" fill="#22d3ee" filter="url(#glow)" />
</svg>
